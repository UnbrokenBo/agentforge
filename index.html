<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentForge — Obsidian Studio &amp; MusicGPT Hub</title>
  <style>
    :root {
      --bg: #0B0C0E;
      --panel: #121419;
      --card: #181A20;
      --border: #2B2420;
      --text: #FFB020;
      --muted: #C46A28;
      --accent: #FF5E1E;
      --amber: #FF9A1F;
      --ok: #39FF14;
      --warn: #FF7A1A;
      --err: #FF2A2A;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.45;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; color: var(--amber); }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .pill { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--card); border: 1px solid var(--border); color: var(--accent); }
    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
    button:active { transform: scale(0.98); }
    button.primary { background: var(--accent); color: #0B0C0E; border-color: var(--accent); }
    button.amber { border-color: var(--amber); color: var(--amber); }
    button.active-tab { border-color: var(--accent); color: var(--accent); background: #221611; }
    .layout { display: grid; grid-template-columns: 1fr; gap: 14px; padding: 14px; max-width: 1400px; margin: 0 auto; }
    @media (min-width: 960px) { .layout { grid-template-columns: 1.55fr 1fr; } }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
    .panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .panel-title { font-size: 13px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--accent); }
    .stage-wrap { background: #08090B; border: 1px solid var(--border); border-radius: 10px; padding: 12px; transition: max-width 0.2s ease; margin: 0 auto; }
    .stage-wrap.mobile-sim { max-width: 390px; }
    .subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    label { display: block; font-size: 11px; color: var(--muted); margin: 10px 0 4px; text-transform: uppercase; letter-spacing: 0.3px; }
    input, textarea, select { width: 100%; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; font-size: 13px; font-family: inherit; }
    textarea { min-height: 76px; resize: vertical; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .vr-stage {
      position: relative; height: 190px; border-radius: 10px; border: 1px solid var(--border);
      background: radial-gradient(circle at 50% 35%, rgba(255, 94, 30, 0.25), transparent 60%),
        repeating-linear-gradient(90deg, rgba(255, 154, 31, 0.08) 0 1px, transparent 1px 28px),
        repeating-linear-gradient(0deg, rgba(255, 154, 31, 0.08) 0 1px, transparent 1px 28px), #090A0D;
      overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 12px; touch-action: none; user-select: none;
    }
    .vr-orb {
      width: 68px; height: 68px; border-radius: 50%; border: 2px solid var(--accent);
      box-shadow: 0 0 24px rgba(255, 94, 30, 0.55), inset 0 0 16px rgba(255, 154, 31, 0.4);
      display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--amber);
      transition: transform 0.08s linear;
    }
    .vr-hud { position: absolute; bottom: 8px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
    .card-item { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-top: 8px; }
    .log-box { background: #08090B; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; max-height: 210px; overflow-y: auto; }
    .log-line { margin-bottom: 6px; border-bottom: 1px solid #1C1613; padding-bottom: 4px; }
    .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); } .muted { color: var(--muted); font-size: 12px; }
    iframe.sandbox-frame { width: 100%; height: 360px; border: 1px solid var(--border); border-radius: 8px; background: #0B0C0E; }
    .hidden { display: none !important; }
    .status-badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: #1D1816; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="dot"></span>
      <span>AgentForge — Obsidian Studio</span>
      <span class="pill" id="envBadge">Sandbox Ready</span>
    </div>
    <div class="header-actions">
      <a href="https://unbrokenbo.github.io/Unbroken-Ecosystem/projects.html" style="text-decoration:none;"><button type="button">Hub Locker</button></a>
      <button type="button" id="btnDesktop" class="active-tab" onclick="setViewport('desktop')">Desktop</button>
      <button type="button" id="btnMobile" onclick="setViewport('mobile')">Mobile</button>
      <button type="button" class="primary" onclick="scrollToDeploy()">Export &amp; Deploy</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="panel-head">
        <span class="panel-title">Live Preview &amp; Studio Stage</span>
        <div class="subtabs" style="margin:0;">
          <button type="button" id="tabMusic" class="active-tab" onclick="switchStageTab('music')">MusicGPT Studio</button>
          <button type="button" id="tabVR" onclick="switchStageTab('vr')">VR Video &amp; Prompts</button>
          <button type="button" id="tabSandbox" onclick="switchStageTab('sandbox')">App Sandbox Tester</button>
        </div>
      </div>

      <div id="stageWrap" class="stage-wrap">
        <div id="viewMusic">
          <div class="row2">
            <div><label>Track Title</label><input id="trackTitle" value="Shady Bacon — Outlaw Ballad" /></div>
            <div><label>Music Style / Genre</label><input id="musicStyle" value="1980s Synth-Pop, Outlaw Country Harmonica, Raw Vocals" /></div>
          </div>
          <label>Audio Prompt (Under 1000 chars)</label>
          <textarea id="musicPrompt">Gritty harmonica lead, punchy analog drum machine, driving bassline, high energy narrative delivery.</textarea>
          <label>Custom Lyrics (Optional)</label>
          <textarea id="musicLyrics">[Verse 1]
82 pounds on the delivery scale,
Struck a match on his stubble in the county jail...</textarea>
          <div class="row2" style="margin-top:8px;">
            <label style="display:flex;align-items:center;gap:6px;margin:0;"><input type="checkbox" id="chkInstrumental" style="width:auto;" /> Instrumental Only</label>
            <label style="display:flex;align-items:center;gap:6px;margin:0;"><input type="checkbox" id="chkVocalOnly" style="width:auto;" /> Vocal Only</label>
          </div>
          <div class="subtabs" style="margin-top:12px;">
            <button type="button" class="primary" onclick="runMusicGPT()">Generate Track (MusicAI)</button>
            <button type="button" class="amber" onclick="copyMusicCurl()">Copy Termux cURL</button>
          </div>
          <div class="card-item">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <strong style="font-size:12px;color:var(--amber);">6-Stem Extraction (/v2/Extraction)</strong>
              <span class="muted">20/hr · 100/day free</span>
            </div>
            <label>Source Audio URL (.mp3 / .wav)</label>
            <input id="stemAudioUrl" placeholder="https://cdn1.musicgpt.com/conversions/...mp3" />
            <div class="subtabs" style="margin-top:8px;margin-bottom:0;">
              <button type="button" onclick="runStemExtraction()">Split 6 Stems</button>
              <button type="button" onclick="copyStemCurl()">Copy Stem cURL</button>
            </div>
          </div>
          <div id="audioResultBox" class="card-item hidden">
            <div style="font-size:12px;font-weight:700;color:var(--ok);margin-bottom:6px;" id="audioResultTitle">Track Ready</div>
            <audio id="audioPlayer" controls style="width:100%;"></audio>
          </div>
        </div>

        <div id="viewVR" class="hidden">
          <div class="vr-stage" id="vrViewport" onpointermove="tiltVR(event)">
            <div class="vr-orb" id="vrOrb">360° STAGE</div>
            <div class="vr-hud">
              <span id="vrCoords">Pitch: 0° · Yaw: 0°</span>
              <span style="color:var(--accent);cursor:pointer;" onclick="toggleVRFullscreen()">[ Fullscreen VR ]</span>
            </div>
          </div>
          <div class="row2">
            <div>
              <label>Scene Preset</label>
              <select id="vrPreset" onchange="buildVideoPrompt()">
                <option value="dog_squad">Tactical Dog Squad (Upright + Pants + Pack &amp; Paw)</option>
                <option value="bacon_bros">Bacon Brothers Delivery Room Tall-Tale</option>
                <option value="unbroken_saga">Unbroken Saga Subterranean Cavern</option>
                <option value="synth_neon">Obsidian &amp; Amber 80s Synth Stage</option>
              </select>
            </div>
            <div>
              <label>Camera Motion</label>
              <select id="vrCamera" onchange="buildVideoPrompt()">
                <option value="360° slow orbital dolly-in, low-angle heroic framing">360° Orbital Dolly-In</option>
                <option value="handheld tactical bodycam push, gritty motion blur">Tactical Bodycam Push</option>
                <option value="wide panoramic VR crane sweep, dramatic rim lighting">Panoramic VR Crane Sweep</option>
              </select>
            </div>
          </div>
          <label>Scene Action / Beat Sync Notes</label>
          <input id="vrAction" value="Standing upright on hind legs in tactical pants, scanning horizon at dusk" oninput="buildVideoPrompt()" />
          <label>Compiled Video / Image Generation Prompt</label>
          <textarea id="vrPromptOutput"></textarea>
          <div class="subtabs" style="margin-top:8px;">
            <button type="button" class="primary" onclick="copyText('vrPromptOutput', 'VR Scene Prompt')">Copy Prompt</button>
            <button type="button" onclick="saveSceneCue()">Save Cue to Timeline</button>
          </div>
          <div id="cueList"></div>
        </div>
